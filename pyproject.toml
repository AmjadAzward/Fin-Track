[project]
name = "fintrack-desktop"
version = "1.0.0"
description = "Offline-first personal finance desktop manager"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6,<7", "openpyxl>=3.1,<4", "reportlab>=4,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
